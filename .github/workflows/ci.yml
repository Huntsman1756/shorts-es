name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
      - name: Lint
        run: |
          uvx ruff@0.8 check src tests
          uvx ruff@0.8 format --check src tests

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: Offline deterministic tests
        run: uv run pytest tests -m "not live" -q
        # No network access is required: fixtures are synthesized in-repo.

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build package
        run: uv build
      - name: Check wheel includes web assets and schema
        run: |
          python -m zipfile -l dist/*.whl | grep "templates/base.html"
          python -m zipfile -l dist/*.whl | grep "static/style.css"
          python -m zipfile -l dist/*.whl | grep "storage/schema.sql"
