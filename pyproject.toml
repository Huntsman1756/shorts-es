[project]
name = "shorts-es"
version = "0.1.1"
description = "Reproducible, auditable access to CNMV public net short-position disclosures"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
authors = [{ name = "shorts-es contributors" }]
keywords = ["cnmv", "short-positions", "provenance", "reproducibility"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "xlrd>=2.0.1,<3",
    "httpx>=0.28,<0.29",
    "typer>=0.15,<0.16",
    "fastapi>=0.115,<0.116",
    "uvicorn>=0.32,<0.33",
    "jinja2>=3.1,<4",
]

[project.scripts]
shorts-es = "shorts_es.cli.main:app"

[project.urls]
Homepage = "https://github.com/Huntsman1756/shorts-es"
Repository = "https://github.com/Huntsman1756/shorts-es"
Issues = "https://github.com/Huntsman1756/shorts-es/issues"
Changelog = "https://github.com/Huntsman1756/shorts-es/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.8,<0.9",
    "hypothesis>=6.119,<7",
    "xlwt>=1.3,<2",
    "httpx>=0.28,<0.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shorts_es"]

[tool.hatch.build.targets.sdist]
include = ["src/shorts_es"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/shorts_es/cli/main.py" = ["B008"]  # typer.Option/Argument defaults are idiomatic
"src/shorts_es/web/*.py" = ["B008"]      # fastapi.Depends defaults are idiomatic

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: tests that require network access to the CNMV source",
]
addopts = "-m 'not live' --strict-markers"

[tool.uv]
package = true
